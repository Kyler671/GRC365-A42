<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
    } @font-face {
        font-family: Candara;
        src: url("../../../Tutorial 4 Portfolio/Candara.ttf");
    } h1 {
        font: 48pt/1.4em Satisfy;
        text-align: center;
        text-shadow: 1px 2px 3px rgba(0,176,173,1.00);
        margin: 24px 0;
    } #textbox {
        width: 1024px;
    	margin: 0 auto;
    	background: whitesmoke;
    	box-shadow: 2px 3px 6px gainsboro;
    	border: 1px solid gainsboro;
    	padding: 20px;
    } figure {
       width: 100%;
    	margin: 24px auto;
    	display: flex;
    	flex-wrap: wrap;
    	justify-content: center;
    	gap: 20px;
    } img, .zoom {
        width: 300px;
		height: 300px;
		border: 1px solid gray;
		box-shadow: 2px 3px 6px gray;
		transition: transform 0.5s;
    } figcaption {
        font: 12pt/1.4em Candara;
        margin-top: 3px;
    } .zoom {
        background: url("thumb-tulip.jpg");
        background-size: 100%;
        background-position: center;
    } img:hover {
        transform: scale(1.03);
        transition: transform 0.5s;
    } .zoom:hover {
        background-size: 105%;
        transition: background-size 0.5s;
    }
</style>
</head>

<body>
    <h1>Portfolio</h1>
    <div id="textbox">
        <!-- Leaves photo -->
        <figure>
            <img src="../../ART 108/IMG_5469.jpg" />
			<img src="../../../Personal/backgreen.jpg" />
			<img src="../../ART 108/IMG_4975.jpg" />
			<img src="../../../Portfolio/ART 156/Pattern.jpg" />
			<img src="../../../Portfolio/ART 156/SELF-PORTRAIT.jpg" />
			<img src="../../../Portfolio/ART 156/GuamKepuha.jpg" />
        </figure>
    </div>
</body>
</html>
